<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Consolas, 'Cascadia Mono', monospace">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#3550ff" stroke-opacity=".3"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#05060d" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060d" stop-opacity=".9"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#05060d"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <g filter="url(#glow)" fill-opacity=".2" stroke-width="3">
    <circle cx="256" cy="192" r="130" fill="none" stroke="#ff3df0" stroke-width="22" stroke-opacity=".35"/>
    <circle cx="256" cy="192" r="141" fill="none" stroke="#ff3df0"/>
    <circle cx="256" cy="192" r="119" fill="none" stroke="#ff3df0"/>
    <rect x="928" y="352" width="192" height="192" fill="#ff8a1f" stroke="#ff8a1f"/>
    <path d="M1024 64l112 112-112 112-112-112z" fill="#ff3b6b" stroke="#ff3b6b"/>
    <rect x="-20" y="486" width="1320" height="52" fill="#ffe14a" stroke="#ffe14a"/>
  </g>

  <g filter="url(#glow)">
    <path d="M120 600C300 560 330 430 470 410s210-10 300-130 110-150 170-160" fill="none" stroke="#3df5ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M968 104l-30 4 10 12 2 16z" fill="#fff" stroke="#3df5ff" stroke-width="3" stroke-linejoin="round"/>
    <rect x="596" y="532" width="24" height="24" transform="rotate(20 608 544)" fill="#6dff8a" fill-opacity=".35" stroke="#6dff8a" stroke-width="3"/>
  </g>

  <rect width="1280" height="640" fill="url(#fade)"/>
  <g text-anchor="middle" font-weight="700" letter-spacing="14" filter="url(#glow)">
    <text x="640" y="320" font-size="92" fill="#fff" stroke="#3df5ff" stroke-width="1.5">NEON <tspan stroke="#ff3df0">GRID</tspan> DASH</text>
  </g>
  <text x="640" y="380" text-anchor="middle" font-size="24" letter-spacing="10" fill="#e8f7ff" fill-opacity=".75">DODGE THE SHAPES. RIDE THE BEAT.</text>
</svg>
